name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      TEST_DATABASE_USERNAME: postgres
      TEST_DATABASE_PASSWORD: postgres
      TEST_DATABASE_NAME: template_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Set up test database
        run: bin/rails db:create db:schema:load
      - name: Run RSpec
        run: bundle exec rspec
      - name: Generate Swagger document
        run: COVERAGE_MINIMUM=0 bundle exec rails rswag:specs:swaggerize
      - name: Verify Swagger document is current
        run: git diff --exit-code -- swagger/v1/swagger.yaml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Brakeman (security)
        run: bundle exec brakeman --no-pager -q
      - name: RuboCop (style)
        run: bundle exec rubocop -f github

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production image
        run: docker build -t template-ruby-rails:production .
      - name: Verify production image contents
        run: |
          docker run --rm --entrypoint sh template-ruby-rails:production -c 'test -f /app/swagger/v1/swagger.yaml'
          ! docker run --rm --entrypoint bundle template-ruby-rails:production show rswag-specs
          ! docker run --rm --entrypoint bundle template-ruby-rails:production show rspec-core
          ! docker run --rm --entrypoint bundle template-ruby-rails:production show rspec-support
