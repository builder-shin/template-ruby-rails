      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/HealthDocument"
        '503':
          description: JSON:API error
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ErrorDocument"
  "/api/schema":
    get:
      summary: OpenAPI schema
