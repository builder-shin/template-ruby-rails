---
openapi: 3.0.1
info:
  title: Template Ruby Rails Example API
  version: v1
servers:
- url: http://localhost:4000
paths:
  "/api/v1/examples":
    get:
      summary: Example 목록 조회
      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ExampleCollectionDocument"
    post:
      summary: Example 생성
      responses:
        '201':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ExampleDocument"
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              "$ref": "#/components/schemas/ExampleCreateDocument"
  "/api/v1/examples/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Example 조회
      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ExampleDocument"
    patch:
      summary: Example 일부 수정
      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ExampleDocument"
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              "$ref": "#/components/schemas/ExamplePatchDocument"
    put:
      summary: Example 생성 또는 전체 교체
      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ExampleDocument"
        '201':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ExampleDocument"
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              "$ref": "#/components/schemas/ExampleReplaceDocument"
    delete:
      summary: Example 삭제
      responses:
        '204':
          description: No Content
      security:
      - BearerAuth: []
  "/api/v1/examples/{id}/relationships/category":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Category linkage 조회
      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/CategoryRelationshipDocument"
    patch:
      summary: Category 관계 교체
      responses:
        '204':
          description: No Content
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              "$ref": "#/components/schemas/CategoryRelationshipDocument"
  "/api/v1/examples/{id}/category":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Category related resource 조회
      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/CategoryDocument"
  "/api/v1/examples/{id}/relationships/tags":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Tag linkage 조회
      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/TagsRelationshipDocument"
    post:
      summary: Tag 관계 추가
      responses:
        '204':
          description: No Content
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              "$ref": "#/components/schemas/TagsRelationshipDocument"
    patch:
      summary: Tag 관계 교체
      responses:
        '204':
          description: No Content
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              "$ref": "#/components/schemas/TagsRelationshipDocument"
    delete:
      summary: Tag 관계 제거
      responses:
        '204':
          description: No Content
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              "$ref": "#/components/schemas/TagsRelationshipDocument"
  "/api/v1/examples/{id}/tags":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Tag related resources 조회
      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/TagCollectionDocument"
  "/api/v1/categories":
    get:
      summary: Category 목록 조회
      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ExampleCategoryCollectionDocument"
  "/api/v1/categories/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Category 조회
      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ExampleCategoryDocument"
  "/api/v1/tags":
    get:
      summary: Tag 목록 조회
      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ExampleTagCollectionDocument"
  "/api/v1/tags/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Tag 조회
      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ExampleTagDocument"
  "/api/v1/users/me":
    get:
      summary: 내 프로필 조회
      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/UserDocument"
      security:
      - BearerAuth: []
  "/api/v1/auth/register":
    post:
      summary: 가입
      responses:
        '201':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/UserDocument"
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              "$ref": "#/components/schemas/AuthRegisterDocument"
  "/api/v1/auth/login":
    post:
      summary: 로그인
      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/AuthTokenDocument"
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              "$ref": "#/components/schemas/AuthLoginDocument"
  "/api/v1/auth/refresh":
    post:
      summary: Refresh token 회전
      responses:
        '200':
          description: JSON:API document
          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/AuthTokenDocument"
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              "$ref": "#/components/schemas/RefreshTokenDocument"
  "/api/v1/auth/logout":
    post:
      summary: 로그아웃
      responses:
        '204':
          description: No Content
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              "$ref": "#/components/schemas/RefreshTokenDocument"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    UserIdentifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - users
        id:
          type: string
          format: uuid
    UserAttributes:
      type: object
      required:
      - email
      - isActive
      - createdAt
      - updatedAt
      properties:
        email:
          type: string
          format: email
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    UserResource:
      allOf:
      - "$ref": "#/components/schemas/UserIdentifier"
      - type: object
        required:
        - attributes
        - links
        properties:
          attributes:
            "$ref": "#/components/schemas/UserAttributes"
          links:
            type: object
    UserDocument:
      type: object
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/UserResource"
    AuthCredentialsAttributes:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
    AuthRegisterDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              enum:
              - users
            attributes:
              "$ref": "#/components/schemas/AuthCredentialsAttributes"
    AuthLoginDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              enum:
              - authCredentials
            attributes:
              "$ref": "#/components/schemas/AuthCredentialsAttributes"
    RefreshTokenAttributes:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
    RefreshTokenDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              enum:
              - refreshTokens
            attributes:
              "$ref": "#/components/schemas/RefreshTokenAttributes"
    AuthTokenIdentifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - authTokens
        id:
          type: string
          format: uuid
    AuthTokenAttributes:
      type: object
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresIn
      - refreshExpiresIn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          minimum: 0
        refreshExpiresIn:
          type: integer
          minimum: 0
    AuthTokenResource:
      allOf:
      - "$ref": "#/components/schemas/AuthTokenIdentifier"
      - type: object
        required:
        - attributes
        properties:
          attributes:
            "$ref": "#/components/schemas/AuthTokenAttributes"
    AuthTokenDocument:
      type: object
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/AuthTokenResource"
    ExampleIdentifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - examples
        id:
          type: string
          format: uuid
    ExampleCategoryIdentifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - exampleCategories
        id:
          type: string
          format: uuid
    ExampleTagIdentifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - exampleTags
        id:
          type: string
          format: uuid
    ExampleAttributes:
      type: object
      required:
      - title
      - description
      - status
      - score
      - createdAt
      - updatedAt
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - draft
          - active
          - archived
        score:
          type: integer
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    ExampleCreateAttributes:
      type: object
      required:
      - title
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - draft
          - active
          - archived
        score:
          type: integer
          minimum: 0
          maximum: 100
    ExamplePatchAttributes:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - draft
          - active
          - archived
        score:
          type: integer
          minimum: 0
          maximum: 100
    ExampleReplaceAttributes:
      type: object
      required:
      - title
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - draft
          - active
          - archived
        score:
          type: integer
          minimum: 0
          maximum: 100
    ExampleCategoryResource:
      allOf:
      - "$ref": "#/components/schemas/ExampleCategoryIdentifier"
      - type: object
        required:
        - attributes
        - links
        properties:
          attributes:
            type: object
            required:
            - name
            properties:
              name:
                type: string
          links:
            type: object
    ExampleTagResource:
      allOf:
      - "$ref": "#/components/schemas/ExampleTagIdentifier"
      - type: object
        required:
        - attributes
        - links
        properties:
          attributes:
            type: object
            required:
            - name
            properties:
              name:
                type: string
          links:
            type: object
    ExampleRelationships:
      type: object
      required:
      - category
      - tags
      properties:
        category:
          type: object
          required:
          - data
          - links
          properties:
            data:
              allOf:
              - "$ref": "#/components/schemas/ExampleCategoryIdentifier"
              nullable: true
            links:
              type: object
        tags:
          type: object
          required:
          - data
          - links
          properties:
            data:
              type: array
              items:
                "$ref": "#/components/schemas/ExampleTagIdentifier"
            links:
              type: object
    ExampleWriteRelationships:
      type: object
      properties:
        category:
          type: object
          required:
          - data
          properties:
            data:
              allOf:
              - "$ref": "#/components/schemas/ExampleCategoryIdentifier"
              nullable: true
        tags:
          type: object
          required:
          - data
          properties:
            data:
              type: array
              items:
                "$ref": "#/components/schemas/ExampleTagIdentifier"
    ExampleResource:
      allOf:
      - "$ref": "#/components/schemas/ExampleIdentifier"
      - type: object
        required:
        - attributes
        - relationships
        - links
        properties:
          attributes:
            "$ref": "#/components/schemas/ExampleAttributes"
          relationships:
            "$ref": "#/components/schemas/ExampleRelationships"
          links:
            type: object
    ExampleCreateDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              enum:
              - examples
            attributes:
              "$ref": "#/components/schemas/ExampleCreateAttributes"
            relationships:
              "$ref": "#/components/schemas/ExampleWriteRelationships"
    ExamplePatchDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - id
          anyOf:
          - required:
            - attributes
          - required:
            - relationships
          properties:
            type:
              type: string
              enum:
              - examples
            id:
              type: string
              format: uuid
            attributes:
              "$ref": "#/components/schemas/ExamplePatchAttributes"
            relationships:
              "$ref": "#/components/schemas/ExampleWriteRelationships"
    ExampleReplaceDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - id
          - attributes
          properties:
            type:
              type: string
              enum:
              - examples
            id:
              type: string
              format: uuid
            attributes:
              "$ref": "#/components/schemas/ExampleReplaceAttributes"
            relationships:
              "$ref": "#/components/schemas/ExampleWriteRelationships"
    ExampleDocument:
      type: object
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/ExampleResource"
        included:
          type: array
          items:
            oneOf:
            - "$ref": "#/components/schemas/ExampleCategoryResource"
            - "$ref": "#/components/schemas/ExampleTagResource"
    ExampleCollectionDocument:
      type: object
      required:
      - data
      - links
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/ExampleResource"
        included:
          type: array
          items:
            oneOf:
            - "$ref": "#/components/schemas/ExampleCategoryResource"
            - "$ref": "#/components/schemas/ExampleTagResource"
        meta:
          type: object
          required:
          - totalCount
          properties:
            totalCount:
              type: integer
              minimum: 0
        links:
          type: object
    CategoryRelationshipDocument:
      type: object
      required:
      - data
      properties:
        data:
          allOf:
          - "$ref": "#/components/schemas/ExampleCategoryIdentifier"
          nullable: true
        links:
          type: object
    TagsRelationshipDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/ExampleTagIdentifier"
        links:
          type: object
    CategoryDocument:
      type: object
      required:
      - data
      properties:
        data:
          allOf:
          - "$ref": "#/components/schemas/ExampleCategoryResource"
          nullable: true
    TagCollectionDocument:
      type: object
      required:
      - data
      - links
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/ExampleTagResource"
        meta:
          type: object
          required:
          - totalCount
          properties:
            totalCount:
              type: integer
              minimum: 0
        links:
          type: object
    ExampleCategoryDocument:
      type: object
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/ExampleCategoryResource"
    ExampleCategoryCollectionDocument:
      type: object
      required:
      - data
      - links
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/ExampleCategoryResource"
        meta:
          type: object
          required:
          - totalCount
          properties:
            totalCount:
              type: integer
              minimum: 0
        links:
          type: object
    ExampleTagDocument:
      type: object
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/ExampleTagResource"
    ExampleTagCollectionDocument:
      type: object
      required:
      - data
      - links
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/ExampleTagResource"
        meta:
          type: object
          required:
          - totalCount
          properties:
            totalCount:
              type: integer
              minimum: 0
        links:
          type: object
