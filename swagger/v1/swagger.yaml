          content:
            application/vnd.api+json:
              schema:
                "$ref": "#/components/schemas/ErrorDocument"
      parameters:
      - name: page[number]
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740992
        description: Offset mode only. (number - 1) * clamped size must not exceed
          9007199254740991.
      - name: page[size]
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          format: int64
          default: 20
        description: Positive int64, clamped to 100 before computing the offset.
      - name: page[totals]
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Include totalCount and the last offset page.
      - name: page[after]
        in: query
        required: false
        schema:
          type: string
          maxLength: 4096
        description: Opaque cursor; empty starts at the boundary. Cannot combine with
          number or the other cursor direction.
      - name: page[before]
        in: query
        required: false
        schema:
          type: string
          maxLength: 4096
        description: Opaque cursor; empty starts at the boundary. Cannot combine with
          number or the other cursor direction.
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated fields; prefix - for descending: title, status,
          score, createdAt, updatedAt. Default: -createdAt.'
      - name: include
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated relationships: category, tags. Empty requests
          included: [].'
      - name: filter[title][exact]
        in: query
        required: false
        schema:
          type: string
        description: exact
      - name: filter[title]
        in: query
        required: false
        schema:
          type: string
        description: Alias of exact.
      - name: filter[title][contains]
        in: query
        required: false
        schema:
          type: string
        description: Case-sensitive literal substring.
      - name: filter[status][exact]
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - active
          - archived
        description: exact
      - name: filter[status]
