components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    JsonApiVersion:
      type: object
      required:
      - version
      properties:
        version:
          type: string
          const: '1.1'
    HealthDocument:
      type: object
      required:
      - data
      - meta
      - jsonapi
      properties:
        data:
          type: 'null'
        meta:
          type: object
          required:
          - status
          properties:
            status:
              type: string
              const: ok
        jsonapi:
          "$ref": "#/components/schemas/JsonApiVersion"
    ErrorDocument:
      type: object
      required:
      - errors
      - jsonapi
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              status:
                type: string
              code:
                type: string
                enum:
                - NOT_ACCEPTABLE
                - UNSUPPORTED_MEDIA_TYPE
                - INVALID_JSONAPI_DOCUMENT
                - INVALID_QUERY_PARAMETER
                - INVALID_FILTER
                - INVALID_SORT
                - INVALID_INCLUDE
                - INVALID_PAGE
                - RESOURCE_NOT_FOUND
                - RELATIONSHIP_RESOURCE_NOT_FOUND
                - TYPE_MISMATCH
                - ID_MISMATCH
                - CLIENT_GENERATED_ID_UNSUPPORTED
                - RESOURCE_CONFLICT
                - VALIDATION_ERROR
                - INTERNAL_SERVER_ERROR
                - HTTP_ERROR
                - AUTHENTICATION_REQUIRED
                - INVALID_TOKEN
                - TOKEN_EXPIRED
                - USER_INACTIVE
                - EMAIL_ALREADY_REGISTERED
                - INVALID_CREDENTIALS
                - TOKEN_REVOKED
              title:
                type: string
              detail:
                type: string
              source:
                type: object
                properties:
                  pointer:
                    type: string
                  parameter:
                    type: string
                  header:
                    type: string
                required: []
              meta:
                type: object
            required:
            - status
            - code
            - title
            - detail
        jsonapi:
          "$ref": "#/components/schemas/JsonApiVersion"
    UserIdentifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - users
        id:
          type: string
          format: uuid
        meta:
          type: object
    UserAttributes:
      type: object
      required:
      - email
      - isActive
      - createdAt
      - updatedAt
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    UserResource:
      allOf:
      - "$ref": "#/components/schemas/UserIdentifier"
      - type: object
        required:
        - attributes
        - links
        properties:
          attributes:
            "$ref": "#/components/schemas/UserAttributes"
          links:
            type: object
            properties:
              self:
                type: string
            required:
            - self
    UserDocument:
      type: object
      required:
      - data
      - jsonapi
      properties:
        data:
          "$ref": "#/components/schemas/UserResource"
        jsonapi:
          "$ref": "#/components/schemas/JsonApiVersion"
    AuthCredentialsAttributes:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
      additionalProperties: false
    AuthRegisterDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              enum:
              - users
            attributes:
              "$ref": "#/components/schemas/AuthCredentialsAttributes"
          additionalProperties: false
      additionalProperties: false
    AuthLoginDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              enum:
              - authCredentials
            attributes:
              "$ref": "#/components/schemas/AuthCredentialsAttributes"
          additionalProperties: false
      additionalProperties: false
    RefreshTokenAttributes:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
      additionalProperties: false
    RefreshTokenDocument:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              enum:
              - refreshTokens
            attributes:
              "$ref": "#/components/schemas/RefreshTokenAttributes"
          additionalProperties: false
      additionalProperties: false
    AuthTokenIdentifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - authTokens
        id:
          type: string
          format: uuid
        meta:
          type: object
    AuthTokenAttributes:
      type: object
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresIn
      - refreshExpiresIn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          minimum: 0
        refreshExpiresIn:
          type: integer
          minimum: 0
    AuthTokenResource:
      allOf:
      - "$ref": "#/components/schemas/AuthTokenIdentifier"
      - type: object
        required:
        - attributes
        properties:
          attributes:
            "$ref": "#/components/schemas/AuthTokenAttributes"
    AuthTokenDocument:
      type: object
      required:
      - data
      - jsonapi
      properties:
        data:
          "$ref": "#/components/schemas/AuthTokenResource"
        jsonapi:
          "$ref": "#/components/schemas/JsonApiVersion"
    ExampleIdentifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - examples
        id:
          type: string
          format: uuid
        meta:
          type: object
    ExampleCategoryIdentifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - exampleCategories
        id:
          type: string
          format: uuid
        meta:
          type: object
    ExampleTagIdentifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - exampleTags
        id:
          type: string
          format: uuid
        meta:
          type: object
    ExampleAttributes:
      type: object
      required:
      - title
      - description
      - status
      - score
      - createdAt
      - updatedAt
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - draft
          - active
          - archived
        score:
          type: integer
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    ExampleCreateAttributes:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type:
          - string
          - 'null'
